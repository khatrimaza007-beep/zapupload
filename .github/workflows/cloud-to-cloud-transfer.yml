name: Cloud-to-Cloud Upload

run-name: TransferIt row ${{ inputs.row_number }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      r2_url:
        description: Public R2 Download URL for the original file
        required: true
        type: string
      filename:
        description: Original filename to preserve in TransferIt
        required: false
        type: string
      row_number:
        description: Google Sheet row number, used only for tracking
        required: true
        type: string
      request_id:
        description: Unique request ID supplied by main.py
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transferit-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-transferit-py-v2
          restore-keys: ${{ runner.os }}-transferit-py-

      - name: Install dependencies
        run: python -m pip install transferit-py httpx beautifulsoup4 pycryptodomex websockets uvloop

      - name: Transfer R2 to TransferIt
        env:
          SOURCE_URL: ${{ inputs.r2_url }}
          SOURCE_FILENAME: ${{ inputs.filename }}
          RESULT_JSON: ${{ runner.temp }}/transferit-result.json
        run: |
          set -o pipefail
          python cloud_to_cloud_upload.py \
            --url "$SOURCE_URL" \
            --filename "$SOURCE_FILENAME" \
            --result-json "$RESULT_JSON" \
            --mode auto \
            --staged-max-gib 25 \
            --cleanup-above-gib 8 \
            --download-workers 8 \
            --upload-workers 8 | tee "$RUNNER_TEMP/transferit.log"

      - name: Upload TransferIt result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transferit-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/transferit-result.json
          if-no-files-found: warn
          retention-days: 3
